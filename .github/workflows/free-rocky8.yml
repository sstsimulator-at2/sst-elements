---
name: Build/test on Rocky Linux 8

on:
  workflow_call:

concurrency:
  group: free-rocky8-${{github.workflow}}-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:
  rocky8:
    name: Build/test core devel and elements ref
    runs-on: ubuntu-26.04
    container:
      image: rockylinux/rockylinux:10.2@sha256:827d37bc128288ccf160ee318bb3cb92d591164cb217e92f8bc61e3982ae1834
    steps:

      - name: Install git
        run: |
          dnf -y upgrade
          dnf -y install git

      - name: Clone core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sst-core
          persist-credentials: false
          ref: devel
          repository: sstsimulator-at2/sst-core

      - name: Clone elements
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sst-elements
          persist-credentials: false

      - name: Install system-level dependencies
        run: |
          sst-core/.github/scripts/install_os_level_dependencies.sh

      - name: Install ccache
        run: |
          dnf -y install 'dnf-command(config-manager)'
          dnf -y config-manager --set-enabled powertools
          dnf -y install epel-release
          dnf -y install ccache

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          create-symlink: true
          key: >-
            free-rocky8-mpi
          max-size: "1.5GB"
          # Only devel saves: caches from other refs are not shared, and
          # they push the devel caches out of the 10 GB repo limit.
          save: ${{ github.ref == 'refs/heads/devel' }}
          verbose: 2

      - name: Create unprivileged build user
        run: |
          sst-core/.github/scripts/run_as_ci_user.sh --setup

      - name: Set environment variables
        run: |
          MAKEFLAGS="-j$(nproc)"
          {
              echo "MAKEFLAGS=${MAKEFLAGS}"
              echo "TERM=dumb"
              # https://github.com/open-mpi/ompi/issues/11295
              echo "PSM3_DEVICES=self"
          } >> "${GITHUB_ENV}"

      - name: Compile core
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          # TODO the argument does nothing as long as Spack is unavailable
          sst-core/.github/scripts/core_autotools_noflags_nodeps.sh gcc

      - name: Test core
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          install_autotools_noflags_nodeps_gcc/bin/sst-test-core

      - name: Save sst_test_outputs after core tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sst_test_outputs_core_free-rocky8
          path: sst_test_outputs
          compression-level: 9
          if-no-files-found: error
          retention-days: 5
        if: ${{ !cancelled() }}

      - name: Compile elements
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          # TODO the argument does nothing as long as Spack is unavailable
          sst-core/.github/scripts/elements_autotools_noflags_nodeps.sh gcc

      - name: Test elements
        shell: bash sst-core/.github/scripts/run_as_ci_user.sh {0}
        run: |
          install_autotools_noflags_nodeps_gcc/bin/sst-test-elements

      - name: Save sst_test_outputs after elements tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sst_test_outputs_elements_free-rocky8
          path: sst_test_outputs
          compression-level: 9
          if-no-files-found: error
          retention-days: 5
        if: ${{ !cancelled() }}
