---
name: ci

# yamllint disable-line rule:truthy
on:
  # Branches in this repository get tested through their pull requests.
  push:
    branches:
      - devel
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ci-${{github.workflow}}-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:
  prechecks:
    uses: $/.github/workflows/pre-commit.yml
  all-prechecks:
    needs: [prechecks]
    name: CI precheck success
    runs-on: ubuntu-26.04
    steps:
      - name: Success
        run: "true"
  tests:
    needs: [all-prechecks]
    uses: $/.github/workflows/build_and_test.yml
    permissions:
      actions: write # needed by skip-duplicate-actions
  all-tests:
    needs: [tests]
    name: CI success
    runs-on: ubuntu-26.04
    steps:
      - name: Success
        run: "true"
